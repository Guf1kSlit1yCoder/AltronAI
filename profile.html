<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профиль ALTRON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Фон профиля с градиентом как в Telegram */
        .profile-header {
            background: linear-gradient(180deg, rgba(35,40,50,1) 0%, rgba(25,28,35,1) 100%);
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            background-position: center;
            background-size: cover;
        }

        /* Кнопки действий (Выбрать фото, Изменить и тд) */
        .action-btn {
            background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(0.96);
        }

        /* Поля ввода для режима редактирования */
        .edit-input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 6px 0;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .edit-input:focus {
            border-bottom: 1px solid #3b82f6;
        }

        /* Уведомления (вместо системных alert) */
        #toast {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 30px;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-10">

    <!-- Верхний блок (Фон, Аватар, Никнейм) -->
    <div class="profile-header pt-12 pb-6 px-4 rounded-b-3xl shadow-2xl relative" id="profileBackgroundDiv">
        
        <!-- Кнопка назад -->
        <div class="absolute top-5 left-5 text-gray-300 text-xl cursor-pointer hover:text-white transition" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </div>
        <!-- Кнопка меню/настроек -->
        <div class="absolute top-5 right-5 text-gray-300 text-xl cursor-pointer hover:text-white transition">
            <i class="fas fa-ellipsis-v"></i>
        </div>

        <!-- Аватарка и статус -->
        <div class="flex flex-col items-center">
            <div class="relative">
                <img id="avatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=Shelby&backgroundColor=121212" alt="Avatar" class="w-28 h-28 rounded-full border-4 border-[#1a1d24] object-cover shadow-lg">
                <!-- Статус (скрыт по умолчанию) -->
                <div id="statusBadge" class="absolute bottom-0 right-0 bg-gray-800 rounded-full w-8 h-8 flex items-center justify-center text-xl border-2 border-[#1a1d24] hidden shadow-sm">
                    ✨
                </div>
            </div>

            <!-- Имя -->
            <h1 class="text-2xl font-bold mt-4 flex items-center gap-2 tracking-wide">
                <span id="displayNameDisplay">Загрузка...</span>
                <!-- Поле ввода имени для редактирования -->
                <input type="text" id="displayNameInput" class="edit-input hidden text-center font-bold text-2xl w-48" placeholder="Имя">
                <i id="devBadge" class="fas fa-shield-alt text-blue-400 text-sm hidden" title="Владелец"></i>
            </h1>
            <p class="text-sm text-gray-400 mt-1">в сети</p>
        </div>

        <!-- Кнопки панели управления -->
        <div class="grid grid-cols-3 gap-3 mt-6 max-w-md mx-auto">
            <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
            
            <button onclick="document.getElementById('avatarInput').click()" class="action-btn py-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 backdrop-blur-sm">
                <i class="fas fa-camera text-lg"></i>
                <span class="text-[11px] font-medium tracking-wide">Выбрать фото</span>
            </button>
            <button onclick="toggleEditMode()" id="editBtn" class="action-btn py-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 backdrop-blur-sm">
                <i class="fas fa-pen text-lg"></i>
                <span class="text-[11px] font-medium tracking-wide" id="editBtnText">Изменить</span>
            </button>
            <button onclick="openSettings()" class="action-btn py-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 backdrop-blur-sm">
                <i class="fas fa-cog text-lg"></i>
                <span class="text-[11px] font-medium tracking-wide">Настройки</span>
            </button>
        </div>
    </div>

    <!-- Информационный блок -->
    <div class="max-w-md mx-auto mt-5 px-4 space-y-4">
        
        <!-- О себе -->
        <div class="bg-[#1c1c1e] rounded-2xl p-4 shadow-sm border border-gray-800/50">
            <h3 class="text-[11px] text-blue-400 font-bold uppercase tracking-widest mb-3">О себе</h3>
            <div id="bioDisplay" class="text-sm text-gray-200 leading-relaxed whitespace-pre-wrap">Напишите что-нибудь о себе...</div>
            <div id="bioEdit" class="hidden">
                <textarea id="bioInput" rows="3" class="edit-input text-sm resize-none bg-gray-900/50 rounded-lg p-3 w-full border-none" placeholder="Расскажите о себе..."></textarea>
            </div>
        </div>

        <!-- Имя пользователя -->
        <div class="bg-[#1c1c1e] rounded-2xl p-4 shadow-sm border border-gray-800/50">
            <h3 class="text-[11px] text-blue-400 font-bold uppercase tracking-widest mb-3">Имя пользователя</h3>
            <div id="usernameDisplay" class="text-[17px] text-white font-medium">@username</div>
            <div id="usernameEdit" class="hidden">
                <div class="flex items-center text-[17px] text-white bg-gray-900/50 rounded-lg px-3">
                    <span class="text-gray-500 font-medium">@</span>
                    <input type="text" id="usernameInput" class="edit-input border-none ml-1 flex-1 bg-transparent" placeholder="username">
                </div>
                <p class="text-[11px] text-gray-500 mt-3 leading-tight">По этому юзернейму вас смогут найти другие пользователи.</p>
            </div>
        </div>

        <!-- Системная информация -->
        <div class="bg-[#1c1c1e] rounded-2xl p-4 shadow-sm border border-gray-800/50">
            <h3 class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">Аккаунт</h3>
            <div class="text-sm text-gray-300 flex items-center gap-2">
                <i class="fas fa-envelope text-gray-500"></i>
                <span id="emailDisplay">user@mail.com</span>
            </div>
        </div>
    </div>

    <!-- Кастомный Toast -->
    <div id="toast" class="fixed left-1/2 transform -translate-x-1/2 bottom-[-50px] bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm z-50 flex items-center gap-3 border border-gray-700">
        <i class="fas fa-info-circle text-blue-400 text-lg"></i>
        <span id="toastMsg" class="font-medium">Сообщение</span>
    </div>

    <script>
        // ВНИМАНИЕ: СЮДА НУЖНО ВСТАВИТЬ ВАШУ ССЫЛКУ С RENDER КОГДА ЗАПУСТИТЕ СЕРВЕР
        const BACKEND_URL = 'https://altron-backend.onrender.com'; 
        
        // Получаем email текущего пользователя из хранилища (или используем заглушку для тестов)
        const currentUserEmail = localStorage.getItem('userEmail') || 'test@gmail.com';

        let isEditing = false;
        let currentProfile = {};

        // Функция показа уведомлений
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const icon = toast.querySelector('i');
            
            msgEl.textContent = msg;
            icon.className = isError ? 'fas fa-exclamation-circle text-red-400 text-lg' : 'fas fa-check-circle text-green-400 text-lg';
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Загрузка профиля при открытии страницы
        async function loadProfile() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUserEmail })
                });

                const data = await res.json();
                if (data.success) {
                    currentProfile = data.profile;
                    updateUI(currentProfile);
                } else {
                    document.getElementById('emailDisplay').textContent = currentUserEmail;
                }
            } catch (err) {
                console.error("Сервер недоступен:", err);
                document.getElementById('emailDisplay').textContent = currentUserEmail;
                showToast('Ошибка загрузки. Показываются локальные данные.', true);
            }
        }

        // Обновление элементов на странице
        function updateUI(profile) {
            document.getElementById('displayNameDisplay').textContent = profile.nickname || 'Пользователь';
            document.getElementById('displayNameInput').value = profile.nickname || '';
            document.getElementById('emailDisplay').textContent = profile.email;
            
            if (profile.avatar) {
                document.getElementById('avatarImg').src = profile.avatar;
            }
            
            if (profile.bio) {
                document.getElementById('bioDisplay').textContent = profile.bio;
                document.getElementById('bioInput').value = profile.bio;
            }

            if (profile.username) {
                document.getElementById('usernameDisplay').textContent = '@' + profile.username;
                document.getElementById('usernameInput').value = profile.username;
            }

            if (profile.isUncensored) {
                document.getElementById('devBadge').classList.remove('hidden');
            }

            if (profile.profileBackground) {
                document.getElementById('profileBackgroundDiv').style.backgroundImage = `url(${profile.profileBackground})`;
            }
        }

        // Переключение режима Изменить / Сохранить
        async function toggleEditMode() {
            const editBtn = document.getElementById('editBtn');
            const editBtnText = document.getElementById('editBtnText');
            const editIcon = editBtn.querySelector('i');

            isEditing = !isEditing;

            if (isEditing) {
                // Включаем поля редактирования
                document.getElementById('displayNameDisplay').classList.add('hidden');
                document.getElementById('displayNameInput').classList.remove('hidden');
                
                document.getElementById('bioDisplay').classList.add('hidden');
                document.getElementById('bioEdit').classList.remove('hidden');
                
                document.getElementById('usernameDisplay').classList.add('hidden');
                document.getElementById('usernameEdit').classList.remove('hidden');

                if (document.getElementById('usernameDisplay').textContent.trim() === '@username') {
                    document.getElementById('usernameInput').value = '';
                }

                editBtnText.textContent = "Сохранить";
                editIcon.className = "fas fa-check text-lg text-green-400";
                editBtn.classList.add('bg-green-500/20');
            } else {
                // Выключаем поля и сохраняем на сервер
                const newName = document.getElementById('displayNameInput').value.trim() || 'Пользователь';
                const newBio = document.getElementById('bioInput').value;
                const newUsername = document.getElementById('usernameInput').value;

                document.getElementById('displayNameDisplay').textContent = newName;
                document.getElementById('displayNameDisplay').classList.remove('hidden');
                document.getElementById('displayNameInput').classList.add('hidden');

                document.getElementById('bioDisplay').textContent = newBio || "Напишите что-нибудь о себе...";
                document.getElementById('bioDisplay').classList.remove('hidden');
                document.getElementById('bioEdit').classList.add('hidden');

                document.getElementById('usernameDisplay').textContent = newUsername ? '@' + newUsername : '@username';
                document.getElementById('usernameDisplay').classList.remove('hidden');
                document.getElementById('usernameEdit').classList.add('hidden');

                editBtnText.textContent = "Изменить";
                editIcon.className = "fas fa-pen text-lg";
                editBtn.classList.remove('bg-green-500/20');

                // Отправка на бэкенд
                await saveProfileToServer({
                    email: currentUserEmail,
                    nickname: newName,
                    bio: newBio,
                    username: newUsername
                });
            }
        }

        // Загрузка аватарки и конвертация в Base64
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Ограничение 5мб
            if (file.size > 5 * 1024 * 1024) {
                showToast("Файл слишком большой! Максимум 5MB.", true);
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                document.getElementById('avatarImg').src = base64Image;
                showToast("Сохранение фото...");
                
                await saveProfileToServer({
                    email: currentUserEmail,
                    avatar: base64Image
                });
            };
            reader.readAsDataURL(file);
        }

        // Центральная функция отправки данных на сервер
        async function saveProfileToServer(profileData) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/save-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
                
                const data = await res.json();
                if (data.success) {
                    showToast("Профиль сохранен!");
                } else {
                    showToast(data.error || "Ошибка сохранения", true);
                }
            } catch (err) {
                showToast("Нет связи с сервером", true);
            }
        }

        function goBack() {
            // Возврат к основному интерфейсу чата
            window.location.href = 'index.html'; 
        }

        function openSettings() {
            showToast("Настройки профиля в разработке");
        }

        // Инициализация при старте
        loadProfile();
    </script>
</body>
</html>
