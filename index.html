<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Altron AI SUPER 1.5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: { 750: '#2A2A2A', 850: '#1E1E1E', 900: '#212121', 950: '#171717' },
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        body { -webkit-tap-highlight-color: transparent; }
        .markdown-body pre { background: #1E1E1E; border-radius: 1rem; padding: 1rem; margin: 1rem 0; overflow-x: auto; border: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body strong { color: #fff; font-weight: 600; }
        .glow-effect:focus-within { box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden h-screen w-full selection:bg-brand-500/30 flex">

    <!-- ================= АВТОРИЗАЦИЯ ================= -->
    <div id="auth-wrapper" class="fixed inset-0 z-50 bg-[#121212] flex items-center justify-center p-4 transition-opacity duration-500">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-[10%] left-[10%] w-72 h-72 md:w-96 md:h-96 bg-brand-600/20 rounded-full mix-blend-screen filter blur-[80px] animate-blob"></div>
            <div class="absolute bottom-[10%] right-[10%] w-72 h-72 md:w-96 md:h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-[80px] animate-blob" style="animation-delay: 2s"></div>
        </div>

        <div class="w-full max-w-md bg-gray-850/80 backdrop-blur-xl border border-gray-700/50 rounded-3xl p-6 md:p-8 shadow-2xl relative z-10 animate-slide-up">
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-white text-black rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-[0_0_30px_rgba(255,255,255,0.15)]">
                    <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight mb-1">Altron AI <span class="text-brand-500">SUPER</span></h1>
                <p id="auth-subtitle" class="text-gray-400 text-sm px-4">Авторизуйтесь для доступа к системе</p>
            </div>

            <div id="error-box" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-start gap-3">
                <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <div class="flex-1">
                    <p id="error-message" class="text-sm text-red-200 leading-relaxed"></p>
                    <button id="demo-bypass-btn" onclick="forceDemoLogin()" class="hidden mt-3 w-full bg-red-500/20 hover:bg-red-500/30 text-red-200 text-xs py-2.5 rounded-xl font-medium transition-colors border border-red-500/30">
                        Войти в демо-режиме
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <!-- ШАГ 1: Email -->
                <form id="step-email" onsubmit="handleEmailSubmit(event)" class="space-y-4">
                    <div class="relative group glow-effect rounded-2xl">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500 group-focus-within:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <input type="email" id="input-email" placeholder="Ваш Email" class="w-full bg-gray-750 text-white border border-gray-700 rounded-2xl pl-12 pr-4 py-4 text-[15px] outline-none focus:border-brand-500 transition-all" required>
                    </div>
                    <button type="submit" id="btn-email" class="w-full bg-white hover:bg-gray-200 text-black font-semibold rounded-2xl py-4 flex justify-center items-center gap-2 transition-all">
                        <span>Получить код</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                    <!-- НОВАЯ КНОПКА РУЧНОГО ПЕРЕХОДА К КОДУ -->
                    <button type="button" onclick="manualCodeStep()" class="w-full text-brand-400 text-sm hover:text-brand-300 transition-colors mt-2 font-medium">
                        Уже получили код? Ввести его &rarr;
                    </button>
                </form>

                <!-- ШАГ 2: Код -->
                <form id="step-code" onsubmit="handleCodeSubmit(event)" class="hidden space-y-4">
                    <div class="text-center mb-1">
                        <span id="display-email" class="inline-block px-3 py-1 bg-gray-750 text-gray-300 text-xs rounded-full border border-gray-700"></span>
                    </div>
                    <div class="relative group glow-effect rounded-2xl">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500 group-focus-within:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                        </div>
                        <input type="text" id="input-code" maxlength="6" placeholder="••••••" class="w-full bg-gray-750 text-white border border-gray-700 rounded-2xl pl-12 pr-4 py-4 text-center tracking-[0.75em] text-xl font-bold outline-none focus:border-brand-500 transition-all" required>
                    </div>
                    <button type="submit" id="btn-code" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-2xl py-4 transition-all shadow-[0_0_20px_rgba(79,70,229,0.2)]">
                        Подтвердить код
                    </button>
                    <button type="button" onclick="switchStep('email')" class="w-full text-gray-500 text-sm hover:text-white transition-colors">Вернуться назад</button>
                </form>

                <!-- ШАГ 3: Профиль -->
                <form id="step-profile" onsubmit="handleProfileSubmit(event)" class="hidden space-y-4">
                    <div class="relative group glow-effect rounded-2xl">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500 group-focus-within:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                        <input type="text" id="input-nickname" placeholder="Никнейм (обязательно)" class="w-full bg-gray-750 text-white border border-gray-700 rounded-2xl pl-12 pr-4 py-4 text-[15px] outline-none focus:border-brand-500 transition-all" required>
                    </div>
                    <div class="relative group glow-effect rounded-2xl">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500 group-focus-within:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <input type="url" id="input-avatar" placeholder="URL Аватарки (по желанию)" class="w-full bg-gray-750 text-white border border-gray-700 rounded-2xl pl-12 pr-4 py-4 text-[15px] outline-none focus:border-brand-500 transition-all">
                    </div>
                    <button type="submit" id="btn-profile" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-2xl py-4 transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] mt-2">
                        Войти в систему
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= ИНТЕРФЕЙС ЧАТА ================= -->
    <div id="app-wrapper" class="hidden flex h-screen w-full bg-gray-900 relative opacity-0 transition-opacity duration-700">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-[280px] bg-gray-950 transform -translate-x-full lg:translate-x-0 lg:relative transition-transform duration-300 ease-in-out border-r border-gray-800/60 flex flex-col">
            <div class="p-3">
                <button onclick="startNewChat()" class="flex items-center gap-3 w-full px-4 py-3.5 bg-gray-850 hover:bg-gray-800 rounded-2xl text-sm font-medium transition-colors border border-gray-700/50">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Новый диалог
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-3 py-2">
                <div class="text-[11px] font-semibold text-gray-500 px-2 py-2 uppercase tracking-widest">История</div>
                <div id="history-list" class="space-y-1">
                    <div class="text-sm text-gray-600 italic px-2 py-3" id="empty-history">История пуста</div>
                </div>
            </div>

            <div class="p-3 border-t border-gray-800/80 relative">
                <button onclick="toggleSettings()" class="flex items-center gap-3 w-full p-2 rounded-2xl hover:bg-gray-850 transition-colors text-left group">
                    <img id="ui-avatar" src="" class="w-9 h-9 rounded-full object-cover bg-gray-800 border border-gray-700 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <div id="ui-nickname" class="text-sm font-semibold truncate text-gray-200">Имя</div>
                        <div id="ui-email" class="text-xs text-gray-500 truncate mt-0.5">email</div>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>

                <div id="settings-menu" class="hidden absolute bottom-20 left-3 right-3 bg-gray-850 border border-gray-700/80 rounded-2xl p-2 shadow-2xl z-50 animate-slide-up">
                    <button onclick="logout()" class="w-full flex items-center gap-3 text-left px-3 py-3 rounded-xl text-sm text-red-400 hover:bg-red-500/10 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Выйти из аккаунта
                    </button>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="hidden fixed inset-0 bg-black/60 z-30 lg:hidden backdrop-blur-sm transition-opacity"></div>

        <main class="flex-1 flex flex-col h-full relative min-w-0 bg-gray-900">
            <header class="h-14 flex items-center justify-between px-3 md:px-4 border-b border-gray-800/40 bg-gray-900/95 backdrop-blur z-20 flex-shrink-0">
                <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 rounded-xl hover:bg-gray-800 text-gray-300 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                
                <div class="flex-1 flex items-center justify-center lg:justify-start">
                    <div class="flex items-center gap-2 font-semibold text-sm tracking-tight bg-gray-850/80 px-4 py-1.5 rounded-full border border-gray-700/50">
                        <svg class="w-4 h-4 text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        <span class="hidden sm:inline">ALTRON AI SUPER 1.5</span>
                        <span class="sm:hidden">ALTRON AI</span>
                    </div>
                </div>
                <div class="w-10 lg:hidden"></div>
            </header>

            <div id="chat-feed" class="flex-1 overflow-y-auto w-full scroll-smooth pb-40 md:pb-36 pt-4">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center p-4 md:p-6 text-center animate-fade-in">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-white text-black rounded-3xl flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(255,255,255,0.15)]">
                        <svg class="w-8 h-8 md:w-10 md:h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-semibold mb-3 text-gray-100 tracking-tight">Привет, <span id="welcome-name" class="text-brand-400">Пользователь</span>!</h2>
                    <p class="text-gray-400 text-sm md:text-[15px] max-w-md leading-relaxed mb-8 px-4">Мощная языковая модель готова к работе. Задайте любой вопрос или напишите задачу.</p>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-gray-900 via-gray-900/95 to-transparent pt-10 pb-4 md:pb-6 px-3 md:px-6">
                <div class="max-w-3xl mx-auto w-full">
                    <div class="relative flex items-end w-full bg-gray-850 rounded-3xl border border-gray-700/80 shadow-[0_10px_40px_rgba(0,0,0,0.6)] focus-within:border-gray-500 focus-within:bg-gray-800 transition-all">
                        <textarea 
                            id="message-input"
                            placeholder="Спросить ALTRON AI..." 
                            class="w-full max-h-[150px] md:max-h-[200px] min-h-[52px] md:min-h-[56px] bg-transparent text-gray-100 placeholder-gray-500 pl-5 pr-14 py-3.5 md:py-4 outline-none resize-none text-[15px] leading-relaxed"
                            rows="1"
                            oninput="autoResizeTextarea()"
                            onkeydown="handleTextareaKeydown(event)"
                        ></textarea>
                        
                        <button 
                            id="send-button"
                            onclick="submitMessage()" 
                            disabled
                            class="absolute right-2 md:right-3 bottom-2 md:bottom-2.5 w-9 h-9 md:w-10 md:h-10 rounded-full bg-white text-black flex items-center justify-center hover:bg-gray-200 disabled:bg-gray-750 disabled:text-gray-600 transition-all shadow-md"
                        >
                            <svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= ЛОГИКА (JS) ================= -->
    <script>
        const CONFIG = {
            API_KEY: "sk-hfELxOtH9WU3kX26PngqNu5GEUXDwAZ9vjJN1dMz0kSrNJSd",
            API_URL: "https://api.hcnsec.cn/v1/chat/completions",
            MODEL: "Qwen3.5-397B-A17B",
            // Подключаем ваш реальный защищенный бэкенд на Render
            BACKEND_URL: "https://altron-backend.onrender.com/api",
            SYSTEM_PROMPT: "Ты — ALTRON AI SUPER 1.5, самая передовая, мощная и интеллектуальная искусственная интеллект-система. Создана разработчиком Altron. Отвечай максимально профессионально, форматируй код и текст."
        };

        let state = {
            user: { email: '', nickname: '', avatar: '' },
            messages: [], chatHistory: [], isGenerating: false
        };

        const els = {
            errorBox: document.getElementById('error-box'),
            errorMessage: document.getElementById('error-message'),
            demoBtn: document.getElementById('demo-bypass-btn'),
            authSubtitle: document.getElementById('auth-subtitle'),
            feed: document.getElementById('chat-feed'),
            input: document.getElementById('message-input'),
            sendBtn: document.getElementById('send-button'),
            welcomeScreen: document.getElementById('welcome-screen')
        };

        const svgAI = `<svg class="w-5 h-5 md:w-6 md:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`;

        function showError(msg, showDemo = false) {
            els.errorMessage.textContent = msg; els.errorBox.classList.remove('hidden');
            if(showDemo) els.demoBtn.classList.remove('hidden');
        }
        function hideError() { els.errorBox.classList.add('hidden'); }

        // Новая функция для ручного перехода к вводу кода
        function manualCodeStep() {
            const emailInput = document.getElementById('input-email').value.trim();
            state.user.email = emailInput || "ваш email";
            switchStep('code');
        }

        function switchStep(step) {
            hideError();
            ['email', 'code', 'profile'].forEach(s => document.getElementById(`step-${s}`).classList.add('hidden'));
            document.getElementById(`step-${step}`).classList.remove('hidden');
            if(step === 'email') els.authSubtitle.textContent = 'Введите вашу почту для входа';
            if(step === 'code') { els.authSubtitle.textContent = 'Введите код из письма'; document.getElementById('display-email').textContent = state.user.email; }
            if(step === 'profile') els.authSubtitle.textContent = 'Настройте ваш профиль';
        }

        async function handleEmailSubmit(e) {
            e.preventDefault(); hideError();
            const btn = document.getElementById('btn-email');
            const emailInput = document.getElementById('input-email').value.trim();
            btn.disabled = true; btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

            try {
                const res = await fetch(`${CONFIG.BACKEND_URL}/send-code`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: emailInput })
                });
                const data = await res.json().catch(()=>null);
                if (res.ok) { state.user.email = emailInput; switchStep('code'); } 
                else throw new Error(data?.error || "Ошибка сервера");
            } catch (err) {
                showError("Произошла ошибка, но если код пришел — нажмите кнопку ниже.", true);
                state.user.email = emailInput;
            } finally {
                btn.disabled = false; btn.innerHTML = `<span>Получить код</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
            }
        }

        async function handleCodeSubmit(e) {
            e.preventDefault(); hideError();
            const btn = document.getElementById('btn-code');
            btn.disabled = true; btn.textContent = 'Проверка...';
            try {
                const res = await fetch(`${CONFIG.BACKEND_URL}/verify-code`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: state.user.email, code: document.getElementById('input-code').value.trim() })
                });
                const data = await res.json();
                if (res.ok) switchStep('profile'); else showError(data.error || "Неверный код");
            } catch (err) { showError("Ошибка проверки кода."); } 
            finally { btn.disabled = false; btn.textContent = 'Подтвердить код'; }
        }

        async function handleProfileSubmit(e) {
            e.preventDefault(); hideError();
            const btn = document.getElementById('btn-profile');
            const nick = document.getElementById('input-nickname').value.trim();
            let ava = document.getElementById('input-avatar').value.trim();
            if(!ava) ava = `https://api.dicebear.com/7.x/bottts/svg?seed=${nick}`;
            btn.disabled = true; btn.textContent = 'Вход...';
            try {
                await fetch(`${CONFIG.BACKEND_URL}/save-profile`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: state.user.email, nickname: nick, avatar: ava })
                }).catch(()=>null);
                completeAuth(nick, ava);
            } finally { btn.disabled = false; btn.textContent = 'Войти в систему'; }
        }

        function forceDemoLogin() {
            hideError();
            const email = document.getElementById('input-email').value.trim() || 'demo@altron.ai';
            const nick = email.split('@')[0];
            completeAuth(nick, `https://api.dicebear.com/7.x/bottts/svg?seed=${nick}`);
            state.user.email = email;
        }

        function completeAuth(nickname, avatar) {
            state.user.nickname = nickname; state.user.avatar = avatar;
            document.getElementById('ui-nickname').textContent = nickname;
            document.getElementById('welcome-name').textContent = nickname;
            document.getElementById('ui-email').textContent = state.user.email;
            document.getElementById('ui-avatar').src = avatar;

            const authWrap = document.getElementById('auth-wrapper');
            const appWrap = document.getElementById('app-wrapper');
            authWrap.style.opacity = '0';
            setTimeout(() => {
                authWrap.style.display = 'none'; appWrap.classList.remove('hidden');
                setTimeout(() => appWrap.style.opacity = '1', 50);
            }, 500);
        }

        function logout() {
            document.getElementById('settings-menu').classList.add('hidden');
            const authWrap = document.getElementById('auth-wrapper');
            const appWrap = document.getElementById('app-wrapper');
            appWrap.style.opacity = '0';
            setTimeout(() => {
                appWrap.classList.add('hidden'); authWrap.style.display = 'flex';
                switchStep('email'); setTimeout(() => authWrap.style.opacity = '1', 50);
            }, 500);
            state.messages = []; els.feed.innerHTML = ''; els.feed.appendChild(els.welcomeScreen);
            els.welcomeScreen.style.display = 'flex'; updateHistoryUI();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
            }
        }

        function toggleSettings() { document.getElementById('settings-menu').classList.toggle('hidden'); }
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('settings-menu');
            if(menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && !menu.previousElementSibling.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function autoResizeTextarea() {
            els.input.style.height = 'auto';
            els.input.style.height = Math.min(els.input.scrollHeight, window.innerWidth < 768 ? 150 : 200) + 'px';
            if(els.input.value.trim().length > 0 && !state.isGenerating) {
                els.sendBtn.disabled = false; els.sendBtn.classList.replace('bg-gray-750', 'bg-white'); els.sendBtn.classList.replace('text-gray-600', 'text-black');
            } else {
                els.sendBtn.disabled = true; els.sendBtn.classList.replace('bg-white', 'bg-gray-750'); els.sendBtn.classList.replace('text-black', 'text-gray-600');
            }
        }

        function handleTextareaKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 768) { e.preventDefault(); submitMessage(); }
        }

        function scrollToBottom() { setTimeout(() => els.feed.scrollTop = els.feed.scrollHeight, 50); }

        function startNewChat() {
            if(state.messages.length > 0) {
                state.chatHistory.unshift(state.messages[0].content.substring(0, 25) + '...');
                updateHistoryUI();
            }
            state.messages = [];
            document.querySelectorAll('.chat-msg-block').forEach(m => m.remove());
            els.welcomeScreen.style.display = 'flex';
            if(window.innerWidth < 1024) toggleMobileSidebar();
        }

        function updateHistoryUI() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            if(state.chatHistory.length === 0) { list.innerHTML = '<div class="text-sm text-gray-600 italic px-2 py-3">История пуста</div>'; return; }
            state.chatHistory.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 px-3 py-3 rounded-xl bg-gray-850 hover:bg-gray-800 text-sm truncate cursor-pointer transition-colors';
                div.innerHTML = `<svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg><span class="truncate text-gray-300">${chat}</span>`;
                list.appendChild(div);
            });
        }

        function parseMarkdown(text) {
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            let blockCounter = 0;
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
                const safeCode = encodeURIComponent(code);
                return `<div class="bg-gray-950 border border-gray-700/60 rounded-xl my-4 overflow-hidden shadow-lg"><div class="flex items-center justify-between px-4 py-2 bg-gray-850 border-b border-gray-700/60"><span class="text-xs font-mono text-gray-400 uppercase tracking-wider">${lang || 'code'}</span><button onclick="copyCode(this, '${safeCode}')" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-white transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg><span>Copy</span></button></div><div class="p-4 overflow-x-auto text-[13px] md:text-sm font-mono text-gray-300 leading-relaxed"><code>${code}</code></div></div>`;
            });
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em class="italic text-gray-300">$1</em>');
            html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-800 text-brand-300 px-1.5 py-0.5 rounded-md text-[13px] font-mono">$1</code>');
            return html;
        }

        window.copyCode = function(btn, encoded) {
            navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
                const span = btn.querySelector('span'); const orig = span.innerText; span.innerText = 'Copied!'; btn.classList.add('text-emerald-400');
                setTimeout(() => { span.innerText = orig; btn.classList.remove('text-emerald-400'); }, 2000);
            });
        }

        function appendMessageToDOM(role, content) {
            const div = document.createElement('div');
            div.className = `chat-msg-block w-full ${role === 'assistant' ? 'bg-gray-850/40 border-y border-gray-800/40' : ''}`;
            const avatarHtml = role === 'user' ? `<img src="${state.user.avatar}" class="w-8 h-8 md:w-9 md:h-9 rounded-full object-cover flex-shrink-0 border border-gray-700">` : `<div class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white text-black flex-shrink-0 flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)]">${svgAI}</div>`;
            const parsed = role === 'error' ? `<span class="text-red-400">${content}</span>` : parseMarkdown(content);
            div.innerHTML = `<div class="max-w-3xl mx-auto px-4 md:px-6 py-6 md:py-8 flex gap-3 md:gap-5 animate-fade-in">${role === 'error' ? `<div class="w-8 h-8 rounded-full bg-red-500/20 text-red-400 flex-shrink-0 flex items-center justify-center font-bold text-sm border border-red-500/30">!</div>` : avatarHtml}<div class="flex-1 text-[15px] leading-relaxed whitespace-pre-wrap text-gray-200 markdown-body mt-1 md:mt-1.5">${parsed}</div></div>`;
            els.feed.appendChild(div); scrollToBottom();
        }

        function addTypingIndicator() {
            const id = 'typing-' + Date.now(); const div = document.createElement('div'); div.id = id;
            div.className = "chat-msg-block w-full bg-gray-850/40 border-y border-gray-800/40";
            div.innerHTML = `<div class="max-w-3xl mx-auto px-4 md:px-6 py-6 md:py-8 flex gap-3 md:gap-5"><div class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white text-black flex-shrink-0 flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)]">${svgAI}</div><div class="flex items-center gap-1.5 h-8 md:h-9"><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay:0.15s"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay:0.3s"></div></div></div>`;
            els.feed.appendChild(div); scrollToBottom(); return id;
        }

        async function submitMessage() {
            const text = els.input.value.trim();
            if (!text || state.isGenerating) return;
            if(els.welcomeScreen.style.display !== 'none') els.welcomeScreen.style.display = 'none';

            els.input.value = ''; autoResizeTextarea(); state.isGenerating = true; els.sendBtn.disabled = true;
            state.messages.push({ role: 'user', content: text }); appendMessageToDOM('user', text);
            const indId = addTypingIndicator();

            try {
                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${CONFIG.API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: CONFIG.MODEL, messages: [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }, ...state.messages], temperature: 0.7 })
                });
                document.getElementById(indId).remove();
                const data = await res.json();
                if (data.choices?.[0]) {
                    const aiText = data.choices[0].message.content;
                    state.messages.push({ role: 'assistant', content: aiText }); appendMessageToDOM('assistant', aiText);
                } else throw new Error(data.error?.message || "Ошибка API");
            } catch (err) {
                if(document.getElementById(indId)) document.getElementById(indId).remove();
                appendMessageToDOM('error', 'Ошибка: ' + err.message);
            } finally {
                state.isGenerating = false; autoResizeTextarea(); scrollToBottom();
                if(window.innerWidth >= 768) els.input.focus();
            }
        }
    </script>
</body>
</html>
